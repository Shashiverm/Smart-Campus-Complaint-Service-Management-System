services:
  mongodb:
    image: mongo:latest
    container_name: smart-campus-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:latest
    container_name: smart-campus-redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
    container_name: smart-campus-backend
    env_file:
      - ./backend/.env
    depends_on:
      - mongodb
      - redis
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
    container_name: smart-campus-frontend
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
    ports:
      - "3000:3000"

  nginx:
    image: nginx:latest
    container_name: smart-campus-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  mongodb_data:
